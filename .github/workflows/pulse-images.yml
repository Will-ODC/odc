name: pulse-images

# Always create the check; build/scan only image inputs or scheduled/manual runs.
# Keep the check present even when there is nothing to build, so it can be required.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pulse-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: pulse-images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Select image checks
        id: selection
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_HEAD: ${{ github.sha }}
          CI_FULL: ${{ github.event_name != 'pull_request' }}
        run: node .github/scripts/select-tests.mjs --images
      - name: No Pulse changes
        if: steps.selection.outputs.images == 'false'
        run: echo 'no Pulse changes'
      # The context is the repo root, as both Dockerfiles say: pulse is a pnpm
      # workspace and the lockfile lives at the top.
      - name: Build the API image
        if: steps.selection.outputs.images == 'true'
        run: docker build -f apps/pulse/Dockerfile -t pulse-api:ci .
      - name: Check the API image has no package manager
        if: steps.selection.outputs.images == 'true'
        run: |
          docker run --rm --entrypoint sh pulse-api:ci -c 'for t in yarn yarnpkg npm npx corepack; do if command -v "$t" >/dev/null; then echo "package manager present: $t"; exit 1; fi; done'
      # Exercise the deployed server's processor: fully decode a sample JPEG
      # and encode both WebP variants (ADR-0047). metadata() alone reads only
      # the header and would not prove that the picture can be decoded.
      - name: Check the API image can process pictures
        if: steps.selection.outputs.images == 'true'
        run: |
          # CI depends on apps/pulse/test/fixtures/image-smoke.jpg.
          docker run --rm -i --entrypoint node -w /app \
            --mount "type=bind,source=$PWD/apps/pulse/test/fixtures/image-smoke.jpg,target=/tmp/image-smoke.jpg,readonly" \
            pulse-api:ci --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';

          try {
            const { processImage, sniff } = await import('./dist/src/images/process.js');
            const result = await processImage(readFileSync('/tmp/image-smoke.jpg'));
            assert.equal(result.width, 400);
            assert.equal(result.height, 300);
            for (const variant of ['display', 'thumb']) {
              assert.equal(sniff(result[variant].bytes), 'webp', `${variant} must be WebP`);
            }
            console.log('Picture processing passed: sample JPEG decoded into display and thumb WebP variants');
          } catch (error) {
            console.error('Picture processing FAILED: the API image could not process the sample JPEG into both WebP variants', error);
            process.exitCode = 1;
          }
          JS
      - name: Build the web image
        if: steps.selection.outputs.images == 'true'
        id: build-web
        run: docker build -f apps/pulse-web/Dockerfile -t pulse-web:ci .
      - name: Scan the API image
        if: steps.selection.outputs.images == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Pin the scanner binary independently of the action wrapper.
          # Pinned on purpose and bumped by hand; the vulnerability database
          # still updates every run.
          version: v0.70.0
          image-ref: pulse-api:ci
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Scan the web image
        if: ${{ !cancelled() && steps.build-web.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Pin the scanner binary independently of the action wrapper.
          # Pinned on purpose and bumped by hand; the vulnerability database
          # still updates every run.
          version: v0.70.0
          image-ref: pulse-web:ci
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: HIGH,CRITICAL
