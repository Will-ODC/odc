name: repo

# Repo-wide checks on every PR. Service-specific pipelines are added per service
# under their own path filters later (odc-pipeline).
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: repo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: format / lint / typecheck
    runs-on: ubuntu-latest
    # apps/pulse's stores are moving off in-memory Maps and onto Postgres, so
    # its tests need a real database. Deliberately a service on this
    # already-required job rather than a new path-filtered workflow: a new job
    # is not a required check until branch protection is updated, which needs a
    # repo admin. Same reasoning as the fixtures-manifest step below. Split it
    # out later if the container start ever costs more than it is worth.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse
          POSTGRES_DB: pulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulse -d pulse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://pulse:pulse@localhost:5432/pulse_test
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose — action-setup reads the pnpm version from
      # package.json's `packageManager` field, and specifying both errors out.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/verifier/go.mod
          cache-dependency-path: services/verifier/go.sum
      - run: pnpm install --frozen-lockfile
      # These pass trivially while the workspace has no packages yet (turbo runs
      # nothing, prettier checks the tracked files) and grow real teeth as
      # services land.
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      # A database test that skips when DATABASE_URL is unset passes while
      # proving nothing — the deletable-green shape every review of this repo
      # has found. Fail here instead, so that skip branch is unreachable in CI.
      - name: Assert the database is configured
        run: test -n "$DATABASE_URL"
      # Added with the first package that has tests (T5a). Passed trivially
      # before that, exactly as the three above did.
      - run: pnpm run test
      # The Go verifier judges the same immutable fixtures independently. Keep
      # this in the already-required repo job so a new fixture cannot land while
      # the verifier disagrees, even without a branch-protection update.
      - run: go test ./...
        working-directory: services/verifier
      # T8's complete gate: one clean chain and all eight contract tamper cases,
      # each checked by both independent verifiers.
      - run: pnpm --filter @odc/rehearsal rehearse
      # Golden vectors are byte-exact artifacts; nothing else in the repo would
      # notice a corrupted one. Deliberately a step inside this already-required
      # job rather than a new job, so it takes effect without a
      # branch-protection change (which needs a repo admin).
      - run: bash .github/scripts/fixtures-manifest.sh

  diff-size:
    name: diff-size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check diff size
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/diff-size.sh

  memory-index:
    name: memory-index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fails when a top-level workstream directory has no row in
      # memory/INDEX.md. apps/pulse ran nineteen PRs unrecorded; this is the
      # enforcement point that makes the omission loud instead of silent.
      - run: bash .github/scripts/memory-index.sh

  guard-tests:
    name: guard-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Exercises contracts-guard + diff-size against throwaway repos so a
      # regression in the guard logic itself is caught (odc-testing).
      - run: bash .github/scripts/guards.test.sh
