# Built scripts and fonts are same-origin. ResultsPanel, BarChart and Recharts
# need inline styles; scripts do not need unsafe-inline or unsafe-eval.
# Railway terminates TLS at its edge; the trusted protocol map gates HSTS.
add_header Strict-Transport-Security $pulse_hsts always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
