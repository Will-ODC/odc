# Serving the pulse client, and forwarding the API to its own container.
#
# The whole point of this file is the `/api` block: page and API answer on one
# origin, so the `SameSite=Lax` session cookie keeps working exactly as it does
# in development, where vite's proxy does the same job.

# The access log, with the query string removed.
#
# nginx's default `combined` format logs `$request`, which is the whole request
# target — and `GET /api/sign-in/redeem?token=…` carries a live sign-in token
# there. It stays live: that GET deliberately does not consume the token,
# because mail scanners follow every link. `$uri` is the path after any
# rewriting, so the token never reaches the file. `src/main.ts` closes the same
# hole on the API's own logger.
log_format pulse_no_query '$remote_addr - $remote_user [$time_local] '
                          '"$request_method $uri $server_protocol" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';

server {
    # 8080 to match the API's port, so neither container needs a privileged
    # port and a reader does not have to remember which one is which.
    listen 8080;

    access_log /var/log/nginx/access.log pulse_no_query;
    server_name _;

    root /usr/share/nginx/html;

    # Never cached, or a deploy leaves browsers holding the old page — with its
    # old hashed asset names — until they happen to hard-refresh.
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Vite fingerprints these, so the name changes whenever the bytes do and a
    # long cache can never serve a stale one.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /api/ {
        # The service name in docker-compose. In another runtime this is the
        # one line to change.
        proxy_pass http://api:8080;

        proxy_http_version 1.1;
        # The browser's Host, not nginx's: pulse builds no absolute URLs from
        # it today, but a backend that guesses its own address from a rewritten
        # Host is a trap that gets set once and sprung much later.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Without this the API sees "http" and any scheme-aware decision it
        # later makes — a redirect, a Secure cookie check — would be wrong.
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The client routes in the browser: /sign-in is a real URL a person can
    # open or reload, and it has no file behind it. Everything unmatched falls
    # through to the page, which then reads the path itself.
    #
    # It cannot swallow a missing asset or a bad /api path and answer it with
    # the HTML page — which is how a failed fetch turns into "Unexpected token
    # '<'" instead of a 404. That is because nginx picks the LONGEST matching
    # prefix, so `/api/` and `/assets/` win over `/` wherever they appear.
    # Not because this block is written last: source order does not decide it,
    # and an edit made on that belief would not do what its author expects.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
